<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self'" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap" />
  <title>RuneBook</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <button class="brand" id="homeBtn">RuneBook</button>
    <input id="search" type="search" placeholder="Search champion…" autocomplete="off" />
    <span class="spacer"></span>
    <button class="ghost gear" id="settingsBtn" title="Settings">⚙</button>
  </header>
  <div id="offer" class="offer hidden"></div>
  <main id="view"></main>
  <footer class="statusbar">
    <span id="conn" class="conn">● Waiting for League client…</span>
    <span id="patch" class="muted"></span>
  </footer>
  <div id="toast" class="toast hidden"></div>
  <div id="modal" class="modal hidden"></div>
  <script src="app.js"></script>
</body>
</html>
